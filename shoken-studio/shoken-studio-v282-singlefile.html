<script>
'use strict';
const TYPES=['総合所見','総合的な学習の時間','外国語活動','道徳'];
const SUBJECTS=['要検討','国語','算数','生活','社会','理科','音楽','図工','体育','家庭','外国語'];
const INITIAL_BANK=[{"id":1,"grade":3,"subject":"理科","unit":"風とゴムの力のはたらき","text":"「風とゴムの力のはたらき」では、実験結果を比べながら、風の強さと車が動いた距離の関係について考えました。","tag":"架空の文例"},{"id":2,"grade":3,"subject":"外国語活動","unit":"Let's Try! 1 Unit 7","text":"「This is for you.」では、形の言い方に親しみ、友だちとカードを交換する活動に進んで取り組んでいました。","tag":"架空の文例"},{"id":3,"grade":5,"subject":"家庭","unit":"調理の学習","text":"調理の学習では、作業の手順を確認しながら、安全な用具の使い方を意識して取り組んでいました。","tag":"架空の文例"},{"id":4,"grade":6,"subject":"道徳","unit":"規則の尊重","text":"「規則の尊重」では、決まりがある理由を考え、互いに安心して生活するために大切なことについて意見を深めていました。","tag":"架空の文例"}];
const newState=()=>({classes:[{id:1,grade:3,count:34,missing:[],entries:{}}],bank:INITIAL_BANK.map(x=>({...x})),rules:[{from:'友達',to:'友だち',on:true},{from:'一人一人',to:'一人ひとり',on:true}],prefs:{period:'前期',system:'2学期制',maxChars:300,numCol:'A',textCol:'B',startRow:2,header:true,missingMode:'keep',schoolType:'標準テンプレート',mainCount:3},nextId:6});
let S=newState(),page='home',activeClass=1,activeType='総合所見',bankQuery='',bankFilter='すべて',draft='',draftMeta={subject:'理科',unit:'',keywords:'',grade:3},odd=['算数','社会','図工'],even=['国語','理科','音楽'],applySelected='',applyNumbers='',applyMode='append',shareBankId=1,shareType='外国語活動',shareMode='empty',shareTargets={},shareExpanded={},shareResult='',saveRowContext=null,reusableDraft={subject:'',unit:'',text:'',grade:3};
const $=id=>document.getElementById(id);
const E=x=>String(x??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const attr=E;const option=(s,v)=>`<option value="${attr(s)}" ${String(v)===String(s)?'selected':''}>${E(s)}</option>`;
const cur=()=>S.classes.find(c=>c.id===activeClass)||S.classes[0];
const key=(t,n)=>`${t}:${n}`;
function getEnt(c,t,n){return c.entries[key(t,n)]||{subjects:['要検討','要検討','要検討'],text:'',status:'未作成',touched:false}}
function editEnt(c,t,n,patch){c.entries[key(t,n)]={...getEnt(c,t,n),...patch};}
function toast(s){let t=$('notice-toast');if(!t){t=document.createElement('div');t.id='notice-toast';document.body.appendChild(t);t.style.cssText='position:fixed;bottom:20px;right:20px;background:#315d50;color:white;padding:11px 17px;border-radius:12px;z-index:999;box-shadow:0 7px 20px #0002;max-width:90vw'}t.textContent=s;setTimeout(()=>{if(t&&t.parentNode)t.remove()},2800)}
function labelClass(c){return `クラス${c.id} · ${c.grade}年 · ${c.count}名`}
function classOpts(){return S.classes.map(c=>`<option value="${c.id}" ${c.id===activeClass?'selected':''}>${E(labelClass(c))}</option>`).join('')}
function typeOpts(){return TYPES.map(t=>option(t,activeType)).join('')}
function header(t,desc=''){return `<div class="page-heading"><div><div class="page-kicker">SHOKEN STUDIO / YOUR WORKSPACE</div><h1>${E(t)}</h1>${desc?`<p class="muted" style="margin:0">${E(desc)}</p>`:''}</div></div>`}
function field(lbl,content){return `<div class="field"><label>${E(lbl)}</label>${content}</div>`}
function bankOpts(){return S.bank.map(b=>`<option value="${b.id}" ${String(b.id)===String(applySelected)?'selected':''}>${E(`${b.subject}｜${b.unit}｜${b.text.slice(0,20)}…`)}</option>`).join('')}
function stateCount(c,t){let done=0,draft=0,need=0;for(let n=1;n<=c.count;n++){if(c.missing.includes(n))continue;let x=getEnt(c,t,n);if(x.status==='確定')done++;else if(x.status==='要検討')need++;else if(x.text)draft++;}return {done,draft,need}}
function renderTop(){const tabs=[['home','⌂ ホーム'],['settings','⚙ クラス・設定'],['bank','▤ 文例バンク'],['compose','✧ 文章づくり'],['assign','⇄ 一括割り振り'],['share','⇆ クラス横断配置'],['edit','▦ 一覧編集'],['export','⇩ Excel出力']];$('tabs').innerHTML=tabs.map(([id,n])=>`<button class="tab ${page===id?'active':''}" data-action="page" data-page="${id}">${n}</button>`).join('');$('headline').innerHTML=`<div class="micro-top"><div><strong>MY WORKSPACE</strong><span>　/　文例をためて、少しずつ整える</span></div><div><span class="status-dot"></span>ローカル動作 · 保存状況は上部で確認</div></div>`}
function render(){renderTop();const view={home:homeHTML,settings:settingsHTML,bank:bankHTML,compose:composeHTML,assign:assignHTML,share:shareHTML,saveexample:saveExampleHTML,edit:editHTML,export:exportHTML}[page]||homeHTML;$('main').innerHTML=view();}
function homeHTML(){let c=cur(),q=stateCount(c,activeType),total=c.count-c.missing.length,rate=total?Math.round(q.done/total*100):0;return `<section class="hero">
<div class="hero-copy"><div class="hero-kicker"><span>✦</span> SMALL STEPS, BEAUTIFUL PROGRESS</div>
<h1>所見づくりを、<br><em>ちょっと心地よく。</em></h1>
<p>書くことに追われる日も、ここでは自分のペースで。<br>ためた文例を味方にして、必要な文章を一つずつ。</p>
<div class="hero-actions"><button class="btn primary" data-action="page" data-page="edit">続きを編集する ↗</button><span class="hero-action-hint">今日も、できるところまでで大丈夫。</span></div></div>
<div class="hero-art" aria-hidden="true"><div class="hero-aura"></div><div class="hero-sprig"><span class="stem"></span><i class="leaf l1"></i><i class="leaf l2"></i><i class="leaf l3"></i><i class="leaf l4"></i></div><div class="paper-sheet paper-back"></div><div class="paper-sheet paper-front"><div class="paper-kicker">WORDS TO REMEMBER</div><div class="paper-title">一人ひとりの<br>よさを、言葉に。</div><i class="paper-rule"></i><i class="paper-rule middle"></i><i class="paper-rule short"></i></div><div class="paper-badge">little by<br><strong>little.</strong></div></div></section>
<div class="section-head"><div><div class="section-kicker">WORKSPACE / TODAY</div><h2>作業のつづきから</h2></div><span class="section-side">考える時間は大切に。操作は軽やかに。</span></div>
<div class="grid">
<div class="panel c8 workspace-panel"><div class="title-row"><div><div class="eyebrow">YOUR CURRENT PROJECT</div><h2>いまのワークスペース</h2></div><span class="tag">オフライン試作版</span></div>
<div class="two">${field('クラス',`<select id="home-class" data-bind="class">${classOpts()}</select>`)}${field('作成する所見',`<select data-bind="type">${typeOpts()}</select>`)}</div>
<div class="four" style="margin-top:17px"><div class="stat"><div class="n">${c.count}</div><div class="k">作業番号枠</div></div><div class="stat"><div class="n">${q.done}</div><div class="k">確定した文章</div></div><div class="stat"><div class="n">${q.draft}</div><div class="k">下書き中</div></div><div class="stat"><div class="n">${q.need}</div><div class="k">要検討</div></div></div>
<div class="inline" style="margin-top:20px"><button class="btn primary" data-action="page" data-page="assign">一括で割り振る ↗</button><button class="btn" data-action="page" data-page="edit">一覧で編集する</button></div></div>
<div class="panel c4 progress-panel"><div><div class="section-kicker">YOUR PROGRESS</div><h2 style="margin:5px 0 0">少しずつ、前へ。</h2></div><div class="progress-top"><div class="progress-ring" style="--percent:${rate}"><div class="progress-value"><strong>${rate}%</strong><span>COMPLETE</span></div></div></div><div class="progress-note">確定した所見が、ここに積み重なります。</div><div class="progress-legend"><span>対象の作業番号 <b>${total}件</b></span><span>確定済み <b>${q.done}件</b></span><span>未確定 <b>${total-q.done}件</b></span></div></div>
<div class="panel c8 quick-panel"><div class="title-row"><div><div class="section-kicker">HOW IT WORKS</div><h2 style="margin:3px 0 0">書き始めるまで、3ステップ。</h2></div></div><div class="three"><div class="step-card"><div class="step-num">01 / COLLECT</div><strong>文例をためる</strong><p>以前の文章を、必要なときに探せる場所へ。</p><button class="btn" style="margin-top:12px;padding:6px 11px;font-size:11px" data-action="page" data-page="bank">文例バンク ↗</button></div><div class="step-card"><div class="step-num">02 / ARRANGE</div><strong>まとめて配置する</strong><p>同じ文例を、複数クラスの違う番号にも一括で。</p><button class="btn" style="margin-top:12px;padding:6px 11px;font-size:11px" data-action="page" data-page="assign">一括割り振り ↗</button></div><div class="step-card"><div class="step-num">03 / FINISH</div><strong>整えて書き出す</strong><p>確認できた文章から、Excelへ。</p><button class="btn" style="margin-top:12px;padding:6px 11px;font-size:11px" data-action="page" data-page="export">Excel出力 ↗</button></div></div><div class="notice" style="margin-top:17px">この版の「文章づくり」はオフラインの簡易テンプレートです。AI直接生成・学校指定Excel様式の読み込み・教科書データ連携は未実装です。</div></div>
<div class="panel c4 safety-card"><div class="section-kicker">A THOUGHTFUL DESIGN</div><h2 style="margin:5px 0 16px">安心して使うために</h2><div class="warning">児童名や出席番号を入力せず、作業用の番号で管理します。出席番号とは別の番号を使ってください。なお、作業番号でも、実際の児童と対応させると個人情報に当たり得ます。まずは架空データで試し、実運用では学校の承認済み端末とルールを確認してください。</div><p class="muted" style="margin:15px 0 0">このHTMLは外部通信をしない構成です。ただし端末・保存先・バックアップの安全管理は別途必要です。</p></div>
</div>`}
function settingsHTML(){let c=cur();return header('学校・クラス設定','実際の学校名・組名は不要。「クラス1〜9」で管理できます。')+`<div class="grid"><div class="panel c7"><div class="title-row"><h2>担当クラス</h2><button class="btn softbtn" data-action="add-class" ${S.classes.length>=9?'disabled':''}>＋ クラス追加（${S.classes.length}/9）</button></div><div class="stack">${S.classes.map(x=>`<div class="card"><div class="inline between"><strong>クラス${x.id}</strong><button class="btn danger small" data-action="delete-class" data-id="${x.id}" ${S.classes.length===1?'disabled':''}>削除</button></div><div class="three" style="margin-top:9px">${field('学年',`<select data-bind="class-grade" data-id="${x.id}">${Array.from({length:6},(_,i)=>option(i+1,x.grade)).join('')}</select>`)}${field('番号枠数',`<select data-bind="class-count" data-id="${x.id}">${Array.from({length:40},(_,i)=>option(i+1,x.count)).join('')}</select>`)}${field('欠番',`<button class="btn" data-action="open-missing" data-id="${x.id}">${x.missing.length?E(x.missing.join('、')):'設定する'}</button>`)}</div></div>`).join('')}</div></div>
<div class="panel c5"><h2>学校別の文章ルール</h2><div class="stack">${field('所見の期間',`<select data-bind="period">${['前期','後期','年間','1学期','2学期','3学期','要録'].map(x=>option(x,S.prefs.period)).join('')}</select>`)}${field('学期制',`<select data-bind="system">${['2学期制','3学期制'].map(x=>option(x,S.prefs.system)).join('')}</select>`)}${field('総合所見の教科数',`<select data-bind="mainCount">${[2,3].map(x=>option(x,S.prefs.mainCount)).join('')}</select>`)}${field('文章プレビューの上限目安（旧設定）',`<input type="number" min="1" max="1000" data-bind="maxChars" value="${S.prefs.maxChars}">`)}<div class="hint">完成率の判定に使う字数は、下の「所見別の文字数条件」で設定できます。</div></div></div>
<div class="panel wide"><div class="title-row"><h2>学校別の表記ルール</h2><span class="tag">原文は変更しません</span></div><div class="two"><div class="stack">${S.rules.map((r,i)=>`<div class="inline card"><input type="checkbox" data-bind="rule-on" data-index="${i}" ${r.on?'checked':''} aria-label="ルールを有効にする"><span>${E(r.from)} → <strong>${E(r.to)}</strong></span><button class="btn danger" style="margin-left:auto" data-action="remove-rule" data-index="${i}">削除</button></div>`).join('')}</div><div class="stack"><div class="two">${field('変更前',`<input id="rule-from" placeholder="友達">`)}${field('変更後',`<input id="rule-to" placeholder="友だち">`)}</div><button class="btn softbtn" data-action="add-rule">＋ 表記ルールを追加</button><div class="notice">配付資料（PDF・Word・Excel）からルールを自動抽出する機能は今後追加。現在は手入力で確認しながら設定できます。</div></div></div></div></div>`}
function bankHTML(){let list=S.bank.filter(b=>(bankFilter==='すべて'||b.subject===bankFilter)&&(`${b.grade}${b.subject}${b.unit}${b.text}`).toLowerCase().includes(bankQuery.toLowerCase()));return header('文例バンク','1つの文例を全クラスで再利用。番号の割り振りだけはクラスごとに独立します。')+`<div class="grid"><div class="panel c8"><div class="filter">${field('検索',`<input id="bank-search" value="${attr(bankQuery)}" placeholder="例：規則の尊重、外国語、電気">`)}${field('カテゴリー',`<select data-bind="bankFilter">${['すべて',...new Set(S.bank.map(b=>b.subject))].map(x=>option(x,bankFilter)).join('')}</select>`)}</div><div class="small muted" style="margin:12px 0">${list.length}件の文例</div><div class="stack">${list.map(b=>`<div class="card bankcard"><div class="inline between"><div class="inline"><span class="tag">${b.grade}年</span><span class="tag">${E(b.subject)}</span><span class="tag">${E(b.tag||'自作')}</span></div><button class="btn danger" data-action="delete-bank" data-id="${b.id}">削除</button></div><strong>${E(b.unit||'自由文例')}</strong><div class="banktxt">${E(b.text)}</div><div class="inline"><button class="btn softbtn" data-action="copy-bank" data-id="${b.id}">文例をコピー</button><button class="btn" data-action="use-bank" data-id="${b.id}">1クラスに配置</button><button class="btn primary" data-action="share-bank" data-id="${b.id}">複数クラスへ配置 ↗</button></div></div>`).join('')||'<div class="soft muted">該当する文例はありません。</div>'}</div></div>
<div class="panel c4"><h2>文例を追加</h2><div class="stack">${field('学年',`<select id="bank-grade">${Array.from({length:6},(_,i)=>option(i+1,cur().grade)).join('')}</select>`)}${field('教科・領域',`<select id="bank-subject">${[...SUBJECTS.filter(x=>x!=='要検討'),'道徳','外国語活動','総合的な学習の時間','学習全般','生活・特別活動'].map(x=>option(x,'国語')).join('')}</select>`)}${field('単元名／テーマ',`<input id="bank-unit" placeholder="例：電気の通り道">`)}${field('文例',`<textarea id="bank-text" placeholder="所見文例を入力"></textarea>`)}<button class="btn primary" data-action="add-bank">＋ 文例バンクに保存</button><div class="notice">保存するのは、個人を特定しない汎用文例にしてください。元の所見から氏名や固有の事情が分かる記述は除いてください。</div></div></div></div>`}

function missingHTML(c){return `<div class="panel wide"><div class="title-row"><h2>クラス${c.id} の欠番設定</h2><button class="btn" data-action="close-missing">閉じる</button></div><p class="small muted">欠番をタップして選択。欠番と未作成は別の状態として管理します。</p><div class="numgrid">${Array.from({length:c.count},(_,i)=>i+1).map(n=>`<button class="numchip ${c.missing.includes(n)?'missing':''}" data-action="toggle-missing" data-id="${c.id}" data-n="${n}">${n}${c.missing.includes(n)?' ×':''}</button>`).join('')}</div><p class="small muted">現在の欠番：${c.missing.length?c.missing.join('、'):'なし'}</p></div>`}
let missingOpen=0;
const previousRender=render;render=function(){renderTop();let view={home:homeHTML,settings:settingsHTML,bank:bankHTML,compose:composeHTML,assign:assignHTML,share:shareHTML,saveexample:saveExampleHTML,edit:editHTML,export:exportHTML}[page]||homeHTML;let html=view();if(page==='settings'&&missingOpen){let c=S.classes.find(x=>x.id===missingOpen);if(c)html+=`<div class="grid">${missingHTML(c)}</div>`} $('main').innerHTML=html};
function parseNumbers(s,max){let set=new Set();let clean=String(s).trim();if(clean==='奇数')for(let n=1;n<=max;n+=2)set.add(n);else if(clean==='偶数')for(let n=2;n<=max;n+=2)set.add(n);else if(clean==='全員')for(let n=1;n<=max;n++)set.add(n);else clean.split(/[、,\s]+/).filter(Boolean).forEach(part=>{let m=part.match(/^(\d+)\s*[-〜～]\s*(\d+)$/);if(m){let a=+m[1],b=+m[2];for(let n=Math.min(a,b);n<=Math.max(a,b);n++)if(n<=max&&n>=1)set.add(n)}else if(/^\d+$/.test(part)){let n=+part;if(n<=max&&n>=1)set.add(n)}});return [...set].sort((a,b)=>a-b)}
function applyRules(text){return S.rules.filter(r=>r.on&&r.from).reduce((t,r)=>t.split(r.from).join(r.to),text)}
function makeDraft(){let m=draftMeta,keys=m.keywords.split(/[、,，／/\n]+/).map(x=>x.trim()).filter(Boolean);if(!m.unit.trim()&&!keys.length){toast('単元名かキーワードを入力してください');return}let topic=m.unit.trim()||'学習',gist=keys.length?keys.join('、'):'学習内容';if(m.subject==='道徳'){draft=`「${topic}」では、${gist}について考え、自分の考えを深めていました。`;}else if(m.subject==='総合的な学習の時間'){draft=`「${topic}」の活動では、${gist}に取り組み、学習を進めていました。`;}else if(m.subject==='生活・特別活動'){draft=`${topic}では、${gist}などに取り組んでいました。`;}else{draft=`${m.subject}の「${topic}」では、${gist}について考えながら学習に取り組んでいました。`;}draft=applyRules(draft);render()}
function copyText(text){if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(()=>toast('コピーしました')).catch(()=>fallbackCopy(text))}else fallbackCopy(text)}
function fallbackCopy(t){let a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;left:-9999px';document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('コピーしました')}catch(e){toast('コピーに失敗しました')}a.remove()}
function downloadBlob(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}
function jsonBackup(){
 try{
  const d=new Date(),p=n=>String(n).padStart(2,'0');
  const stamp=d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'_'+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds());
  downloadBlob(new Blob([JSON.stringify({version:1,state:S},null,2)],{type:'application/json'}),'所見メーカー_バックアップ_'+stamp+'.json');
  toast('JSONのダウンロードを開始しました。保存されたファイルを確認してください');
  return true;
 }catch(e){alert('JSONを書き出せませんでした：'+e.message);return false}
}
function confirmDataDiscard(message){
 if(confirm('削除前に現在のデータのJSONバックアップを保存しますか？')){
  if(!jsonBackup())return false;
  alert('バックアップのダウンロード先にファイルがあることを確認してから、削除を進めてください。');
 }

 const pre=(subject==='道徳'||subject==='外国語活動'?'':subject+'の')+'「'+unit+'」の学習では、';
 const one=focus?.[0]||'学習した内容や方法を確かめる';
 const two=focus?.[1]||'学んだことを比べたり、理由を考えたりする';
 return [
  {id:'v19:knowledge',axis:'ひな形・知識技能',text:pre+'【実際の活動を確かめて】'+one+'ことができました。'},
  {id:'v19:thinking',axis:'ひな形・思考判断表現',text:pre+'【実際の活動を確かめて】'+two+'ことができました。'},
  {id:'v19:attitude',axis:'ひな形・主体的な態度',text:pre+'【実際の姿を確かめて】自分の考えを試したり見直したりしながら、学習に取り組んでいました。'}
 ];
}
function v19LoadTextbooks(){
 try{
  const raw=localStorage.getItem(V19_PUBLISHER_KEY);
  if(!raw)return;
  const saved=JSON.parse(raw);
  if(!saved||typeof saved!=='object'||Array.isArray(saved))return;
  S.textbooks=S.textbooks||{};
  const allowed=Object.keys(V4_PUBLISHERS);
  for(const [key,value] of Object.entries(saved)){
   const match=key.match(/^([1-6]):(.+)$/);
   if(!match||!allowed.includes(match[2])||typeof value!=='string'||value.length>80)continue;
   if(!S.textbooks[key]||S.textbooks[key]==='未設定')S.textbooks[key]=value;
  }
 }catch(_){}
}
function v19SaveTextbooks(){
 try{
  const out={};
  for(const [key,value] of Object.entries(S.textbooks||{})){
   if(/^[1-6]:/.test(key)&&typeof value==='string'&&value.length<=80&&value!=='未設定')out[key]=value;
  }
  localStorage.setItem(V19_PUBLISHER_KEY,JSON.stringify(out));
  return true;
 }catch(_){return false}
}
v19LoadTextbooks();
const v19AvailablePrior=v8Available;
v8Available=function(c,subject){
 const found=v19AvailablePrior(c,subject),publisher=v4Pub(c.grade,subject);
 const catalog=V19_CATALOG.find(x=>x.grade===c.grade&&x.subject===subject&&x.publisher===publisher);
 if(catalog){
  for(const unit of catalog.units){
   if(!found.some(x=>x.unit===unit))found.push({id:publisher+'┃┃'+unit,publisher,unit,domain:'',choices:[]});
  }
 }
 for(const u of found){
  if(!u.choices.length)u.choices=v19Templates(subject,u.unit);
 }
 return found;
};
const v19PickerPrior=v8Picker;
v8Picker=function(c,t,n){

function v24MatchesPublisher(subject,grade=3){

}

 const old=v24OldMakeIndex();
 const replaced=new Set(V24_UNITS.map(x=>'3|'+x.subject+'|'+v22Norm(x.unit)));
 const kept=old.filter(x=>{
  if(x.source==='保存済みの文例')return true;
  if(!['国語','算数','理科'].includes(x.subject)||x.grade!==3||!v24MatchesPublisher(x.subject))return true;
  return !replaced.has('3|'+x.subject+'|'+v22Norm(x.unit));
 });
 for(const u of V24_UNITS){
  if(!v24MatchesPublisher(u.subject))continue;
  for(const x of u.examples){
   kept.push({grade:3,subject:u.subject,unit:u.unit,axis:V22_AXIS[x.axis],
    criterion:V22_AXIS[x.axis],rawAxis:x.axis,text:x.text,source:'教科書会社の評価計画を参照した独自文例',
    details:u.focus,publisher:u.publisher,sourceUrl:u.sourceUrl,sourceLabel:u.sourceLabel});
  }
 }
 const seen=new Set(),out=[];
 for(const x of kept){
  const key=[x.grade,x.subject,v22Norm(x.unit),v22Norm(x.text)].join('|');
  if(seen.has(key))continue;
  seen.add(key);out.push({...x,index:out.length});

const V25_RULES=[
 {lens:'保護者',id:'vague',regex:/一生懸命(?:頑張|取り組)|頑張りました|努力しました|意欲的に取り組みました|よくできました/g,
  title:'保護者視点：何をしたか、何ができたかを具体的にすると伝わりやすくなります'},
 {lens:'保護者',id:'education-term',regex:/思考・判断・表現|主体的に学習に取り組む態度|資質・能力|メタ認知|形成的評価|概念的理解/g,
  title:'保護者視点：評価用語を、児童が実際に行った活動の言葉に置き換えられるか確認'},
 {lens:'管理職',id:'absolute',regex:/誰よりも|常に|絶対に|必ず|完璧に|一度も|全員の中で|どんなときも/g,
  title:'管理職視点：強い断定や他児童との比較に、十分な根拠があるか確認'},
 {lens:'管理職',id:'vague-result',regex:/力を高めることができました|力が身に付きました|理解を深めました/g,
  title:'管理職視点：どんな学習活動や成果があったか、具体的に書けるか確認'}
];
function v25Hints(value){
 const text=String(value||''),out=[];
 if(!text.trim())return out;
 const add=(lens,id,index,found,title)=>{
  if(index<0||!found)return;
  if(out.some(v=>v.id===id&&v.index===index))return;
  out.push({lens,id,index,length:found.length,found,title});
 };
 for(const rule of V25_RULES){
  for(const m of text.matchAll(rule.regex))add(rule.lens,rule.id,m.index,m[0],rule.title);
 }
 // The title refers to reading a source text; composing another food explanation
 // belongs to the separate writing unit, not this reading unit.
 if(text.includes('すがたをかえる大豆')){
  for(const m of text.matchAll(/(?:資料を調べて.{0,22}文章|説明文を書|文章を書いて|文章を書くこと)/g)){
   add('管理職','soy-reading-writing',m.index,m[0],
    '管理職視点：「すがたをかえる大豆」は読む学習。書く活動の実績が別教材と混ざっていないか確認');
  }
 }
 if(text.includes('食べ物のひみつを教えます')){
  for(const m of text.matchAll(/(?:筆者の工夫|筆者の考え|本文の段落の役割|筆者が示した具体例)/g)){
   add('管理職','food-writing-reading',m.index,m[0],
    '管理職視点：「食べ物のひみつを教えます」は書く学習。読む教材との混同がないか確認');
  }
 }
 for(const m of text.matchAll(/[^。！？\n]{105,}[。！？]/g)){
  const sentence=m[0];const found=sentence.slice(0,Math.min(12,sentence.length));
  add('保護者','long-sentence',m.index,found,
   '保護者視点：一文が長めです。分けると読みやすくなる可能性があります');
 }
 return out.sort((a,b)=>a.index-b.index);
}
const v25BaseChecks=v14Checks;
v14Checks=function(value){

 for(const issue of v25Hints(value)){
  v14Push(out,'v25:'+issue.id,issue.index,issue.length,issue.found,issue.title,null,issue.lens);
 }
 return out.sort((a,b)=>a.index-b.index);
};

-studio-theme] h2,html[data-studio-theme] h3{color:var(--theme-ink)}\nhtml[data-studio-theme] .hero h1{color:#fff}\nhtml[data-studio-theme] .brandbar{background:var(--theme-brand);border-bottom-color:var(--theme-line)}\nhtml[data-studio-theme] .mark{background:var(--theme-deep);box-shadow:none}\nhtml[data-studio-theme] .logo strong,html[data-studio-theme] #headline .micro-top strong{color:var(--theme-deep)}\nhtml[data-studio-theme] .logo-overline,html[data-studio-theme] .muted{color:var(--theme-muted)}\nhtml[data-studio-theme] .pill{background:var(--theme-light);border-color:var(--theme-line);color:var(--theme-deep)}\nhtml[data-studio-theme] .tabs{border-color:var(--theme-line)}\nhtml[data-studio-theme] .tab.active{background:var(--theme-light);color:var(--theme-deep);border-bottom-color:var(--theme-accent)}\nhtml[data-studio-theme] .tab:hover:not(.active){background:var(--theme-neutral);color:var(--theme-deep)}\nhtml[data-studio-theme] .panel,html[data-studio-theme] .card,html[data-studio-theme] .bankcard,html[data-studio-theme] .quick-panel,html[data-studio-theme] .workspace-panel,html[data-studio-theme] .safety-card{background:var(--theme-panel);border-color:var(--theme-line)}\nhtml[data-studio-theme] .btn{color:var(--theme-deep);border-color:var(--theme-line)}\nhtml[data-studio-theme] .btn.primary{color:#fff;background:var(--theme-deep);border-color:var(--theme-deep)}\nhtml[data-studio-theme] .btn.softbtn{color:var(--theme-deep);background:var(--theme-light);border-color:var(--theme-line)}\nhtml[data-studio-theme] .hero{background:linear-gradient(120deg,var(--theme-hero-start) 2%,var(--theme-deep) 48%,var(--theme-hero-end) 100%)}\nhtml[data-studio-theme] .hero .btn.primary{color:var(--theme-deep);background:#fff6e8;border-color:#fff6e8}\nhtml[data-studio-theme] .hero p{color:#fff}\nhtml[data-studio-theme] .progress-ring{background:conic-gradient(var(--theme-accent) calc(var(--percent)*1%),var(--theme-line) 0)}\nhtml[data-studio-theme] .progress-value,html[data-studio-theme] .workspace-panel .stat .n,html[data-studio-theme] .stat .n,html[data-studio-theme] .step-card strong,html[data-studio-theme] .progress-legend b,html[data-studio-theme] .action-link{color:var(--theme-deep)}\nhtml[data-studio-theme] .progress-panel,html[data-studio-theme] .step-card,html[data-studio-theme] .stat,html[data-studio-theme] .workspace-panel .stat,html[data-studio-theme] .soft,html[data-studio-theme] .notice,html[data-studio-theme] .v27-chooser{background:var(--theme-neutral);border-color:var(--theme-line)}\nhtml[data-studio-theme] .progress-ring::before{background:var(--theme-neutral)}\nhtml[data-studio-theme] .tag,html[data-studio-theme] th{background:var(--theme-light);color:var(--theme-deep)}\nhtml[data-studio-theme] .tag.need{background:#faf0dd;color:#9b6840}\nhtml[data-studio-theme] .tag.draft{background:#edf1f8;color:#5b6f86}\nhtml[data-studio-theme] .tag.done{background:#e2f1e6;color:#416b57}\nhtml[data-studio-theme] .field label,html[data-studio-theme] .v27-chooser>strong{color:var(--theme-deep)}\nhtml[data-studio-theme] .field input:focus,html[data-studio-theme] .field select:focus,html[data-studio-theme] .field textarea:focus,html[data-studio-theme] textarea.celltext:focus{border-color:var(--theme-accent);box-shadow:0 0 0 3px var(--theme-light)}\nhtml[data-studio-theme] .v27-catbtn,html[data-studio-theme] .v27-tag{color:var(--theme-deep);border-color:var(--theme-line)}\nhtml[data-studio-theme] .v27-catbtn.chosen,html[data-studio-theme] .v27-tag.chosen{background:var(--theme-light);border-color:var(--theme-accent)}\nhtml[data-studio-theme] .workflow-banner{background:linear-gradient(115deg,var(--theme-light),var(--theme-neutral));border-color:var(--theme-line)}\nhtml[data-studio-theme] .workflow-banner .symbol{background:var(--theme-highlight);color:var(--theme-deep)}\nhtml[data-studio-theme] .status-dot{background:var(--theme-accent);box-shadow:0 0 0 4px var(--theme-light)}\n.top-meta{position:relative}\n.v28-toggle{display:inline-flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}\n.v28-menu{position:absolute;top:calc(100% + 13px);right:0;z-index:600;width:min(360px,calc(100vw - 24px));padding:15px;background:var(--theme-panel);color:var(--theme-ink);border:1px solid var(--theme-line);border-radius:18px;box-shadow:0 16px 48px #203d3640}\n.v28-menu[hidden]{display:none!important}\n.v28-menu-head{font-weight:800;font-size:14px;margin:0 0 9px}\n.v28-menu-sub{font-size:11px;color:var(--theme-muted);margin:0 0 13px}\n.v28-theme-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}\n.v28-option{display:flex;gap:9px;align-items:center;text-align:left;padding:12px 9px;min-width:0;border:2px solid var(--theme-line);border-radius:13px;background:var(--theme-neutral);color:var(--theme-ink);cursor:pointer}\n.v28-option[aria-pressed=\"true\"]{border-color:var(--theme-accent);background:var(--theme-light)}\n.v28-dot{display:block;flex:0 0 25px;width:25px;height:25px;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 1px #0000001c}\n.v28-option strong{font-size:12px;display:block}\n.v28-option small{font-size:10px;color:var(--theme-muted);display:block;line-height:1.5}\n.v28-saved-note{font-size:10px;line-height:1.6;color:var(--theme-muted);margin:12px 0 0}\n@media(max-width:560px){.v28-toggle{padding:8px!important;min-width:38px}.v28-toggle .v28-text{display:none}.v28-option{padding:9px 7px}.v28-option strong{font-size:11px}}\n@media(prefers-reduced-motion:no-preference){html[data-studio-theme] body,html[data-studio-theme] .brandbar{transition:background-color .2s ease}}\n";
 document.head.appendChild(style);
 function setStatus(message){
  const target=document.getElementById('v28-theme-status');
  if(target)target.textContent=message;
 }
 function setTheme(id,persist){
  if(!THEMES.some(t=>t.id===id))return;
  selected=id;
  if(id==='original')document.documentElement.removeAttribute('data-studio-theme');
  else document.documentElement.setAttribute('data-studio-theme',id);
  document.querySelectorAll('.v28-option').forEach(button=>{
   button.setAttribute('aria-pressed',String(button.dataset.v28Theme===id));
  });
  if(persist){
   try{localStorage.setItem(KEY,id);setStatus('この端末に色を保存しました。')}
   catch(_){setStatus('色は切り替えました。この端末では選択を保存できません。')}
  }
 }
 const toggle=document.getElementById('v28-theme-toggle');
 if(!toggle){setTheme(selected,false);return}
 const menu=document.createElement('section');
 menu.className='v28-menu';
 menu.id='v28-theme-menu';
 menu.setAttribute('aria-label','画面のテーマカラー');
 menu.hidden=true;
 menu.innerHTML='<p class="v28-menu-head">🎨 テーマカラー</p>'+
  '<p class="v28-menu-sub">気分に合わせて色を選べます。所見の文章や保存データは変わりません。</p>'+
  '<div class="v28-theme-grid" role="group" aria-label="選べる5色">'+
  THEMES.map(t=>'<button type="button" class="v28-option" data-v28-theme="'+t.id+'" aria-pressed="'+(t.id===selected)+'">'+
   '<span class="v28-dot" style="background:'+t.swatch+'" aria-hidden="true"></span>'+
   '<span><strong>'+t.name+'</strong><small>'+t.hint+'</small></span></button>').join('')+
  '</div><p class="v28-saved-note" id="v28-theme-status" role="status" aria-live="polite">選んだ色を、この端末に保存します。</p>';
 toggle.parentElement.appendChild(menu);
 setTheme(selected,false);
 function openMenu(open){
  menu.hidden=!open;
  toggle.setAttribute('aria-expanded',String(open));
 }
 toggle.addEventListener('click',e=>{e.stopPropagation();openMenu(menu.hidden)});
 menu.addEventListener('click',e=>{
  const button=e.target.closest('[data-v28-theme]');
  if(!button)return;
  setTheme(button.dataset.v28Theme,true);
 });
 document.addEventListener('click',e=>{
  if(!menu.hidden&&!menu.contains(e.target)&&!toggle.contains(e.target))openMenu(false);
 });
 document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!menu.hidden){openMenu(false);toggle.focus()}
 });
})();

</script><script>render();</script></body></html>
