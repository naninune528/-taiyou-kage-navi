<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>でんきのとおりみち 4・5・6じ</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6ee;color:#243d37;font-family:system-ui,sans-serif}main{max-width:850px;margin:auto;padding:20px}header p{color:#65746a}h1{font-size:clamp(24px,4vw,34px);margin:8px 0 20px}nav,.answers,.tools{display:flex;gap:10px;flex-wrap:wrap}button{font:inherit;font-weight:650;min-height:50px;padding:12px 18px;border:2px solid #c3d2c1;background:white;color:#243d37;border-radius:14px;cursor:pointer}button:focus-visible{outline:4px solid #d99327;outline-offset:2px}button:disabled{opacity:.7;cursor:default}.selected,.primary{background:#2c6655;color:white;border-color:#2c6655}article{background:white;border-radius:24px;padding:clamp(16px,3vw,28px);margin-top:20px;box-shadow:0 4px 24px #3140300a}h2{font-size:22px;line-height:1.5;margin:10px 0}.meta{display:flex;justify-content:space-between;color:#65746a;font-size:14px}#diagram{background:#fbfcf8;border:1px solid #e1e7d9;border-radius:16px;overflow:auto;margin:16px 0}svg{display:block;width:100%;min-width:300px;height:auto}#diagram.big svg{min-width:700px}.answers button{flex:1;font-size:22px;min-width:130px}.correct{border-color:#2c6655;background:#e0f1e6}.wrong{border-color:#ac603d;background:#fff0e4}#feedback{line-height:1.85;background:#f4f6ee;border-radius:14px;padding:16px;margin-top:16px}#next{margin-top:12px;width:100%}.tools{justify-content:flex-end}.hint{font-size:14px;line-height:1.7;color:#52675b}footer{font-size:12px;line-height:1.8;color:#65746a;margin:20px 0}[hidden]{display:none!important}.label{font-size:19px;fill:#243d37;font-family:system-ui,sans-serif}.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0}.choice-card{border:3px solid #dce4d6;border-radius:18px;padding:10px;min-width:0;background:#fbfcf8}.choice-card.picked{border-color:#2c6655;background:#e7f1e5}.choice-card svg{min-width:0;width:100%}.choice-card .pick{width:100%;text-align:left;min-height:50px}.choice-card .enlarge{display:block;margin:8px auto 0;font-size:14px;padding:6px 10px;min-height:42px}.choice-card p{font-size:15px;line-height:1.8}.choice-card.good{border-color:#2c6655}.choice-card.bad{border-color:#b8663b}.word-options{display:grid;gap:12px}.word-options button{text-align:left;font-size:21px}dialog{border:2px solid #bed0c0;border-radius:20px;max-width:95vw;width:800px}dialog::backdrop{background:#193b3690}dialog svg{min-width:0}#multiCards[hidden],#wordOptions[hidden]{display:none!important}#feedback{white-space:pre-line}@media(max-width:560px){.cards{grid-template-columns:1fr}} table{border-collapse:collapse;width:100%;font-size:17px}td,th{padding:10px;border:1px solid #bacaaf;text-align:left}caption{padding:10px;line-height:1.7}#options{display:grid;gap:12px}#options button{text-align:left;font-size:19px}#options svg{min-width:0;width:100%;height:auto;max-height:150px}#options span{display:block;line-height:1.7}#figure{margin:18px 0}#figure svg{min-width:0;width:100%;max-height:280px}#feedback{white-space:pre-line}nav button{flex:1}#submit{width:100%;margin-top:15px}.picked{background:#e1eddf;border-color:#2c6655}</style></head><body><main><header><p>しょう3 りか ／ じっけんの あとに</p><h1>💡 でんきの とおりみち</h1><p>しらべかた・けっか・りゆうを たしかめよう。</p></header><nav><button id="tab4" onclick="start(4)">4じ・しらべかた</button><button id="tab5" onclick="start(5)">5じ・きんぞく</button><button id="tab6" onclick="start(6)">6じ・つかってみよう</button></nav><article><p id="progress"></p><h2 id="question"></h2><div id="figure"></div><p id="instruction"></p><div id="options"></div><button id="submit" class="primary" onclick="answer()">こたえあわせ</button><div id="feedback" role="status" aria-live="polite" hidden></div><button id="next" class="primary" onclick="next()" hidden>つぎへ</button><div id="end" hidden></div></article><footer>5じの ひょうは、けっかの れいです。じぶんたちの じっけんの けっかも たしかめましょう。<br>じっけんは せんせいと いっしょに。かんでんちの ＋と−を、どうせんだけで つながないように しましょう。</footer></main><script>const bank=[{"id":0,"lesson":4,"q":"ものが でんきを とおすか しらべます。ずの ふたつの ●は、どうする？","options":["しらべるものに、ひとつずつ あてる","●どうしを つないだままにする","どちらも ものから はなす"],"correct":[0],"why":"ふたつの ●の あいだに しらべるものを いれます。そのものを とおる かいろが できるか、しらべます。","figure":"tester"},{"id":1,"lesson":4,"q":"しらべるまえに、どうぐが つかえるか たしかめたい。どうする？","options":["ふたつの どうせんの さきを ふれさせ、あかりが つくか みる","まめでんきゅうを はずす","かんでんちを はずす"],"correct":[0],"why":"この どうぐには、かんでんちと まめでんきゅうが はいっています。どうせんの さきどうしを ふれさせると、ひとつの わが できます。","figure":"tester"},{"id":2,"lesson":4,"q":"クリップに どうせんを あてます。どの あてかたが よい？","options":["おおいを とった さきを あてる","ビニルの おおいを あてる","クリップから はなす"],"correct":[0],"why":"おおいを とった さきが、クリップに ふれるように します。ビニルの おおいを あてても、でんきは とおりません。","figure":"contactIntro","optionFigures":["contact","cover","away"]},{"id":3,"lesson":4,"q":"クリップを つないでも、つきません。すぐに「とおさない」と きめて よい？","options":["つなぎかたや、どうせんの ふれかたを たしかめる","すぐに「とおさない」と きめる","かんでんちを もうひとつ ふやす"],"correct":[0],"why":"つながっていないと、しらべられません。つなぎかたを たしかめて、もういちど しらべましょう。","figure":"clipOff"},{"id":4,"lesson":4,"q":"クリップを しらべます。どうせんを どう つなぐ？","options":["ふたつの さきを、クリップに ひとつずつ あてる","ひとつだけ あてる","ふたつとも はなす"],"correct":[0],"why":"ふたつの どうせんの さきを、クリップに ひとつずつ あてます。クリップを とおる でんきの とおりみちが できます。","figure":"","optionFigures":["clipBoth","clipOne","clipNone"]},{"id":5,"lesson":5,"q":"この けっかの れいを みよう。ついたものに きょうつうすることは？","options":["きんぞくで できている","どれも まるい","どれも やわらかい"],"correct":[0],"why":"ついたものの ざいりょうは、てつ・どう・アルミニウムです。これらを「きんぞく」と いいます。","figure":"results"},{"id":6,"lesson":5,"q":"ひょうで「あかりが ついた」ものを、ぜんぶ えらぼう。","options":["てつの クリップ","どうの はりがね","アルミホイル","かみ","きの ぼう"],"correct":[0,1,2],"why":"この れいでは、てつ・どう・アルミニウムのものに あかりが ついています。","figure":"results"},{"id":7,"lesson":5,"q":"てつ・どう・アルミニウムを、まとめて なんという？","options":["きんぞく","ガラス","プラスチック"],"correct":[0],"why":"てつ・どう・アルミニウムなどを「きんぞく」と いいます。","figure":""},{"id":8,"lesson":5,"q":"ひょうの けっかから いえることは、どれ？","options":["きんぞくは でんきを とおす","かたいものは、ぜんぶ でんきを とおす","ものの いろで、とおすか きまる"],"correct":[0],"why":"ついたものの ざいりょうを くらべると、きんぞくという きょうつうてんが あります。かたさや いろだけでは きまりません。","figure":"results"},{"id":9,"lesson":5,"q":"ぎんいろの プラスチックを みつけました。みためだけで「でんきを とおす」と きめて よい？","options":["みためだけでは きめず、しらべる","ぎんいろなら、かならず とおす","ぴかぴかなら、かならず とおす"],"correct":[0],"why":"きんぞくに にていても、ざいりょうが ちがうことが あります。みためだけで きめず、しらべましょう。","figure":"shiny"},{"id":10,"lesson":6,"q":"おなじ かんの よこは つかず、けずったところは つきました。どうして？","options":["よこの おおいを とると、きんぞくに ふれられたから","けずると、かんが べつの きんぞくに かわるから","かんが ちいさくなったから"],"correct":[0],"why":"よこには いろを ぬった おおいが あります。けずって おおいを とると、なかの きんぞくに どうせんが ふれて、でんきが とおります。","figure":"can"},{"id":11,"lesson":6,"q":"この かんの けっかから、いえることは？","options":["きんぞくでも、おおいが あると、そのままでは とおらないことが ある","かんは どこも でんきを とおさない","きんぞくは でんきを とおさない"],"correct":[0],"why":"「なにで できているか」と「どこに どうせんを あてたか」の りょうほうが たいせつです。","figure":"can"},{"id":12,"lesson":6,"q":"きんぞくのものに あてても、つきません。つぎに たしかめることを、ぜんぶ えらぼう。","options":["どうせんが しっかり ふれているか","あてたところに、おおいが ないか","すぐに「きんぞくではない」と きめる"],"correct":[0,1],"why":"どうせんが しっかり ふれているか、あてたところに おおいが ないかを たしかめて、もういちど しらべます。","figure":""},{"id":13,"lesson":6,"q":"ずの はりがねが、でんきを とおすか しらべます。どうせんを あてるのは どこと どこ？","options":["アとウ","アとイ","イとウ"],"correct":[0],"why":"アとウは、おおいが なく、なかの きんぞくが でています。りょうはしに ひとつずつ どうせんを あてて しらべます。イは ビニルの おおいです。","figure":"coated"},{"id":14,"lesson":6,"q":"はさみで しらべたら、もちては つかず、はの ところは つきました。いえることは？","options":["ひとつのものでも、ばしょによって ざいりょうが ちがう","はさみは どこでも でんきを とおす","はさみは どこも でんきを とおさない"],"correct":[0],"why":"この はさみは、もちてが プラスチック、はが きんぞくです。ものの なまえだけでなく、あてた ばしょも たしかめましょう。","figure":"scissors"}];
const $=id=>document.getElementById(id);let lesson=4,queue=[],i=0,score=0,done=false,chosen=new Set(),misses=[];
function shuffle(a){a=a.slice();for(let j=a.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a}
function start(n,qs){lesson=n;queue=qs||shuffle(bank.filter(q=>q.lesson===n));i=0;score=0;misses=[];for(const x of [4,5,6])$('tab'+x).className=x===n?'selected':'';show()}
function figure(type){if(type==='results')return '<table><caption>けっかの れい<br>○：ついた ／ ×：つかなかった</caption><tr><th>しらべたもの</th><th>けっか</th></tr>'+[['てつの クリップ','○'],['どうの はりがね','○'],['アルミホイル','○'],['かみ','×'],['きの ぼう','×'],['ガラスの コップ','×']].map(r=>'<tr><td>'+r[0]+'</td><td>'+r[1]+'</td></tr>').join('')+'</table>';if(type==='can')return '<svg viewBox="0 0 600 250" role="img" aria-label="おなじかん。よこはつかず、けずったところはついた。"><rect x="180" y="40" width="240" height="150" rx="25" fill="#708e84" stroke="#294e42" stroke-width="3"/><ellipse cx="300" cy="40" rx="120" ry="22" fill="#c9d6cd" stroke="#294e42"/><path d="M330 90 L385 100 L372 155 L320 147 Z" fill="#dde4df" stroke="#294e42"/><path d="M70 105 H215 M380 125 H535" stroke="#294e42" stroke-width="3"/><circle cx="215" cy="105" r="5"/><circle cx="380" cy="125" r="5"/><text x="15" y="80" font-size="21">よこ：×</text><text x="425" y="95" font-size="19">けずったところ：○</text><text x="180" y="235" font-size="19">おなじ かんを しらべた けっか</text></svg>';if(type==='tester')return '<svg viewBox="0 0 600 290" role="img" aria-label="かんでんちとまめでんきゅうをつないだどうぐ。したにふたつのどうせんのさきがはなれている。"><rect x="75" y="80" width="140" height="64" rx="12" fill="#7899a0" stroke="#294e42"/><text x="88" y="122" font-size="25">−</text><text x="178" y="122" font-size="25">＋</text><path d="M75 110 C20 20 360 5 415 114 M215 110 C250 110 250 230 280 230 M470 110 C540 180 420 230 360 230" fill="none" stroke="#396f72" stroke-width="6"/><circle cx="440" cy="75" r="32" fill="#edf2e9" stroke="#294e42" stroke-width="3"/><rect x="415" y="100" width="60" height="28" fill="#c7cbbc" stroke="#294e42"/><circle cx="280" cy="230" r="7" fill="#294e42"/><circle cx="360" cy="230" r="7" fill="#294e42"/><text x="205" y="274" font-size="20">ここに ものを つなぐ</text></svg>';return ''}

function visual(type){const head='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" role="img" aria-label="'+({contact:'おおいをとったさきがクリップにふれている',cover:'ビニルのおおいがクリップにふれている',away:'どうせんのさきがクリップからはなれている',clipBoth:'ふたつのどうせんのさきがクリップにふれている',clipOne:'ひとつのどうせんだけがクリップにふれている',clipNone:'ふたつともはなれている',coated:'はりがねのアとウはりょうはしのきんぞく。イはまんなかのビニルのおおい。'}[type]||'しらべるものとどうせんのず')+'">';let content='';
const clip='<path d="M240 145 H375 Q420 145 420 115 V95 Q420 65 390 65 H250 Q220 65 220 95 V125 Q220 145 245 145 H360 Q385 145 385 120 V105 Q385 90 365 90 H265" fill="none" stroke="#718880" stroke-width="12" stroke-linecap="round"/>';
if(['contact','cover','away'].includes(type)){const x=type==='away'?170:220;content=clip+'<path d="M30 110 H'+(x-45)+'" stroke="#527c9b" stroke-width="20"/><path d="M'+(x-45)+' 110 H'+x+'" stroke="'+(type==='cover'?'#527c9b':'#b77836')+'" stroke-width="11"/>'+ '<text x="25" y="190" font-size="21">どうせん</text><text x="330" y="190" font-size="21">クリップ</text>';}
if(['clipBoth','clipOne','clipNone'].includes(type)){const a=type==='clipNone'?170:220,b=type==='clipBoth'?420:470;content=clip+'<path d="M30 110 H'+(a-35)+'" stroke="#527c9b" stroke-width="17"/><path d="M'+(a-35)+' 110 H'+a+'" stroke="#b77836" stroke-width="9"/><path d="M'+b+' 110 H'+(b+35)+'" stroke="#b77836" stroke-width="9"/><path d="M'+(b+35)+' 110 H570" stroke="#b45f49" stroke-width="17"/><text x="220" y="200" font-size="21">クリップ</text>';}
if(type==='coated')content='<path d="M80 105 H520" stroke="#b77836" stroke-width="14"/><path d="M150 105 H450" stroke="#527c9b" stroke-width="32" stroke-linecap="round"/><path d="M100 50 V90 M300 50 V80 M500 50 V90" stroke="#253f38" stroke-width="2"/><text x="86" y="40" font-size="25">ア</text><text x="286" y="40" font-size="25">イ</text><text x="486" y="40" font-size="25">ウ</text><text x="75" y="170" font-size="21">きんぞく</text><text x="250" y="170" font-size="21">おおい</text><text x="445" y="170" font-size="21">きんぞく</text>';
if(type==='scissors')content='<ellipse cx="160" cy="95" rx="62" ry="34" fill="none" stroke="#517f8e" stroke-width="19"/><ellipse cx="160" cy="165" rx="62" ry="34" fill="none" stroke="#517f8e" stroke-width="19"/><path d="M210 90 L470 165 L250 125 L470 55 L215 160" fill="#c1cbc5" stroke="#526c60" stroke-width="4"/><circle cx="250" cy="125" r="8" fill="#526c60"/><text x="70" y="30" font-size="20">もちて：×</text><text x="390" y="30" font-size="20">は：○</text>';
if(type==='shiny')content='<rect x="140" y="70" width="320" height="90" rx="20" fill="#c6d1d2" stroke="#718a83" stroke-width="3"/><text x="173" y="123" font-size="23">ぎんいろの プラスチック</text>';
return head+content+'</svg>';}

function show(){done=false;chosen=new Set();const q=queue[i];$('progress').textContent=lesson+'じ ／ '+(i+1)+' / '+queue.length+'もん';$('question').textContent=q.q;$('figure').innerHTML=['coated','scissors','shiny'].includes(q.figure)?visual(q.figure):q.figure==='clipOff'?visual('clipBoth')+'<p>クリップを つないでも、あかりが つきませんでした。</p>':q.figure==='contactIntro'?'<p>あおいところ：ビニルの おおい<br>ちゃいろの さき：おおいを とったところ</p>':figure(q.figure);$('instruction').textContent=q.correct.length>1?'あてはまるものを、ぜんぶ えらぼう。':'ひとつ えらぼう。';for(const id of ['options','submit','instruction','figure'])$(id).hidden=false;for(const id of ['feedback','next','end'])$(id).hidden=true;$('options').replaceChildren();shuffle(q.options.map((t,j)=>({t,j}))).forEach(o=>{const b=document.createElement('button');b.innerHTML='<span>□ '+o.t+'</span>'+(q.optionFigures?visual(q.optionFigures[o.j]):'');b.dataset.index=o.j;b.setAttribute('aria-pressed','false');b.onclick=()=>pick(o.j);$('options').appendChild(b)})}
function pick(j){if(done)return;if(queue[i].correct.length===1){chosen.clear();chosen.add(j)}else chosen.has(j)?chosen.delete(j):chosen.add(j);for(const b of $('options').children){const n=Number(b.dataset.index),on=chosen.has(n);b.className=on?'picked':'';b.innerHTML='<span>'+(on?'☑ ':'□ ')+queue[i].options[n]+'</span>'+(queue[i].optionFigures?visual(queue[i].optionFigures[n]):'');b.setAttribute('aria-pressed',String(on))}}
function answer(){if(done)return;$('feedback').hidden=false;if(!chosen.size){$('feedback').textContent='こたえを えらんでから おしてね。';return}done=true;const q=queue[i],ok=q.options.every((_,j)=>chosen.has(j)===q.correct.includes(j));if(ok)score++;else misses.push(q);for(const b of $('options').children){b.disabled=true;const n=Number(b.dataset.index);if(q.correct.includes(n))b.className='correct';else if(chosen.has(n))b.className='wrong'}$('feedback').textContent=(ok?'○ せいかい！':'たしかめよう。')+'\n'+q.why;$('submit').hidden=true;$('next').hidden=false;$('next').textContent=i===queue.length-1?'けっかを みる':'つぎへ'}
function next(){if(!done)return;if(++i<queue.length)return show();for(const id of ['options','submit','instruction','figure','feedback','next'])$(id).hidden=true;$('progress').textContent='おつかれさま！';$('question').textContent=queue.length+'もんちゅう '+score+'もん せいかい';$('end').hidden=false;$('end').replaceChildren();if(misses.length){const b=document.createElement('button');b.textContent='まちがえた もんだいを もういちど';b.onclick=()=>start(lesson,misses.slice());$('end').appendChild(b)}const b=document.createElement('button');b.textContent='もういちど';b.onclick=()=>start(lesson);$('end').appendChild(b)}start(4);
</script></body></html>
