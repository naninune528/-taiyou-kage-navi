<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>温度計たんけん</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f7f3;color:#203d39;font-family:system-ui,sans-serif}main{max-width:760px;margin:auto;padding:22px}h1{font-size:28px}header p{line-height:1.8}.tabs{display:flex;gap:10px;flex-wrap:wrap}button{font:inherit;border:2px solid #b4cec3;border-radius:14px;background:white;padding:15px;min-height:52px;color:#203d39;cursor:pointer}button:focus-visible{outline:4px solid #e8ad38}button:disabled{cursor:default;opacity:.85}.active,#next{background:#236b59;color:white;border-color:#236b59}.card{margin-top:20px;background:white;border-radius:24px;padding:24px;box-shadow:0 6px 24px #203d390c}h2{font-size:22px;line-height:1.7}#diagram{display:flex;justify-content:center}svg{width:200px;height:320px;max-width:100%}.large svg{height:500px;width:312px}#options{display:grid;gap:12px;margin-top:20px}.good{background:#dcf3e7;border-color:#236b59}.bad{background:#ffefe5;border-color:#c26935}#feedback{line-height:1.9;margin-top:18px}#next{width:100%;margin-top:16px}small{display:block;line-height:1.8;margin-top:20px}#progress{color:#527569}#zoom{padding:8px 16px;min-height:44px;display:block;margin:auto}footer{font-size:12px;line-height:1.7;margin-top:24px;color:#5a7269}@media(min-width:600px){.reading #options{grid-template-columns:1fr 1fr}}</style><main><header><p>小学校 理科</p><h1>🌡️ 温度計たんけん</h1><p>目もりを読もう。はかり方をたしかめよう。</p></header><nav class="tabs" aria-label="コース"><button id="readTab" onclick="start('read')">目もりを読む・5問</button><button id="methodTab" onclick="start('method')">地面のはかり方・5問</button></nav><section class="card" id="card"><p id="progress"></p><h2 id="question"></h2><div id="diagram"></div><button id="zoom" onclick="zoom()">図を大きくする</button><div id="options"></div><div id="feedback" role="status" aria-live="polite"></div><button id="next" onclick="advance()" hidden>つぎへ</button></section><footer>図は学習用のオリジナルです。実物の温度計の目もりも確かめましょう。<br>測り方は、使う器具の説明と先生の指示に合わせましょう。</footer></main><script>
const readings=[{v:18,min:10,max:30,choices:[16,18,20,22]},{v:23,min:10,max:30,choices:[21,23,25,27]},{v:27,min:20,max:40,choices:[23,25,27,29]},{v:32,min:20,max:40,choices:[28,30,32,34]},{v:35,min:20,max:40,choices:[25,30,35,40]}];
const methods=[
{q:'地面の温度を、さしこみ温度計ではかります。先をどこに当てる？',a:['はかりたい地面にさす','地面からはなして、空中に置く','自分の手でにぎる'],e:'さしこみ温度計は、先をはかりたい地面にさして使います。ガラスのぼう温度計をむりにさしてはいけません。'},
{q:'温度計の数字は、いつ読む？',a:['数字が変わらなくなってから','さしてすぐに','地面からぬいて、しばらくしてから'],e:'地面にさしたまま、数字が変わらなくなるのを待って読みます。'},
{q:'日なたと日かげの地面をくらべます。調べる時こくは？',a:['同じ時こくに調べる','日なたは朝、日かげは昼に調べる','好きな時こくに調べる'],e:'温度は時こくによっても変わります。日なたと日かげは、同じ時こくに調べてくらべましょう。'},
{q:'ぼう温度計の赤い液の先を読むとき、目はどこにする？',a:['赤い液の先と同じ高さにして、ま横から見る','上からななめに見る','下からななめに見る'],e:'赤い液の先と目の高さをそろえて、ま横から読みます。'},
{q:'ガラスのぼう温度計で地面をはかります。正しい使い方は？',a:['先に浅いあなをほり、液だめを入れて土をかぶせる','温度計で地面をほる','液だめを空中に出しておく'],e:'別の道具で浅いあなをほり、液だめを入れてまわりの土をかぶせます。温度計には日光が直接当たらないようにします。'}
];
let mode='read',queue=[],index=0,score=0,answered=false,errors=[],retry=false;
const $=id=>document.getElementById(id);
function shuffle(a){return a.slice().sort(()=>Math.random()-.5)}
function start(m,qs=null){mode=m;queue=qs||shuffle(m==='read'?readings:methods);index=score=0;errors=[];retry=!!qs;$('readTab').className=m==='read'?'active':'';$('methodTab').className=m==='method'?'active':'';show()}
function thermometer(q){let s='';const y=v=>280-(v-q.min)*11;for(let v=q.min;v<=q.max;v++){let major=v%10===0,mid=v%5===0;s+=`<path d="M 92 ${y(v)} H ${major?133:mid?124:115}" stroke="#203d39" stroke-width="${major?2:1.3}"/>`;if(major)s+=`<text x="143" y="${y(v)+6}" font-size="19">${v}</text>`}return `<svg viewBox="0 0 210 350" role="img" aria-label="ぼう温度計。数字は${q.min}度から${q.max}度。赤い液の先が示す温度を読みましょう。"><rect x="51" y="27" width="145" height="310" rx="25" fill="#f6faf9" stroke="#b4cec3"/><text x="140" y="25" font-size="20">℃</text><rect x="68" y="49" width="13" height="264" rx="6" fill="#d9e8e5"/><rect x="70" y="${y(q.v)}" width="9" height="${314-y(q.v)}" fill="#dd443e"/><circle cx="74.5" cy="316" r="13" fill="#dd443e"/>${s}</svg>`}
function zoom(){let big=$('diagram').classList.toggle('large');$('zoom').textContent=big?'図をもとにもどす':'図を大きくする'}
function show(){answered=false;const q=queue[index];$('card').className='card '+(mode==='read'?'reading':'');$('progress').textContent=(retry?'もう一度・':'')+(index+1)+' / '+queue.length+'問';$('question').textContent=mode==='read'?'赤い液の先は、何℃ですか？':q.q;$('diagram').innerHTML=mode==='read'?thermometer(q):'';$('diagram').className='';$('zoom').hidden=mode!=='read';$('zoom').textContent='図を大きくする';$('feedback').textContent='';$('next').hidden=true;$('options').replaceChildren();let opts=mode==='read'?q.choices.map(v=>({t:v+'℃',ok:v===q.v})):q.a.map((t,i)=>({t,ok:i===0}));shuffle(opts).forEach(o=>{let b=document.createElement('button');b.textContent=o.t;b.dataset.ok=o.ok;b.onclick=()=>answer(o,b,q);$('options').appendChild(b)})}
function answer(o,b,q){if(answered)return;answered=true;if(o.ok)score++;else errors.push(q);for(const el of $('options').children){el.disabled=true;if(el.dataset.ok==='true')el.className='good'}if(!o.ok)b.className='bad';$('feedback').textContent=(o.ok?'○ せいかい！ ':'もう一度たしかめよう。 ')+(mode==='read'?`答えは${q.v}℃。この温度計は、小さい1目もりが1℃です。赤い液のいちばん上まで数えましょう。`:q.e);$('next').textContent=index+1===queue.length?'結果を見る':'つぎへ';$('next').hidden=false}
function advance(){if(!answered)return;if(++index<queue.length){show();return}finish()}
function finish(){$('progress').textContent='おつかれさま！';$('question').textContent=queue.length+'問中 '+score+'問せいかい';$('diagram').innerHTML='';$('zoom').hidden=true;$('feedback').textContent=errors.length?'まちがえた問題に、もう一度ちょうせんしよう。':'ぜんぶせいかい！ 別のコースにも取り組もう。';$('next').hidden=true;$('options').replaceChildren();if(errors.length){let b=document.createElement('button');b.textContent='まちがえた問題をもう一度';b.onclick=()=>start(mode,errors.slice());$('options').appendChild(b)}let b=document.createElement('button');b.textContent='同じコースをもう一度';b.onclick=()=>start(mode);$('options').appendChild(b)}
start('read');
</script></html>
