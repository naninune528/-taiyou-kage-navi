name: SHOKEN STUDIO safety smoke tests
on:
  push:
    branches: ["work/shoken-safety-20261101"]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node shoken-studio/tests/safety-smoke.cjs
