<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>でんきのかいろ つく？つかない？</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6ee;color:#243d37;font-family:system-ui,sans-serif}main{max-width:850px;margin:auto;padding:20px}header p{color:#65746a}h1{font-size:clamp(24px,4vw,34px);margin:8px 0 20px}nav,.answers,.tools{display:flex;gap:10px;flex-wrap:wrap}button{font:inherit;font-weight:650;min-height:50px;padding:12px 18px;border:2px solid #c3d2c1;background:white;color:#243d37;border-radius:14px;cursor:pointer}button:focus-visible{outline:4px solid #d99327;outline-offset:2px}button:disabled{opacity:.7;cursor:default}.selected,.primary{background:#2c6655;color:white;border-color:#2c6655}article{background:white;border-radius:24px;padding:clamp(16px,3vw,28px);margin-top:20px;box-shadow:0 4px 24px #3140300a}h2{font-size:22px;line-height:1.5;margin:10px 0}.meta{display:flex;justify-content:space-between;color:#65746a;font-size:14px}#diagram{background:#fbfcf8;border:1px solid #e1e7d9;border-radius:16px;overflow:auto;margin:16px 0}svg{display:block;width:100%;min-width:300px;height:auto}#diagram.big svg{min-width:700px}.answers button{flex:1;font-size:22px;min-width:130px}.correct{border-color:#2c6655;background:#e0f1e6}.wrong{border-color:#ac603d;background:#fff0e4}#feedback{line-height:1.85;background:#f4f6ee;border-radius:14px;padding:16px;margin-top:16px}#next{margin-top:12px;width:100%}.tools{justify-content:flex-end}.hint{font-size:14px;line-height:1.7;color:#52675b}footer{font-size:12px;line-height:1.8;color:#65746a;margin:20px 0}[hidden]{display:none!important}.label{font-size:19px;fill:#243d37;font-family:system-ui,sans-serif}.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0}.choice-card{border:3px solid #dce4d6;border-radius:18px;padding:10px;min-width:0;background:#fbfcf8}.choice-card.picked{border-color:#2c6655;background:#e7f1e5}.choice-card svg{min-width:0;width:100%}.choice-card .pick{width:100%;text-align:left;min-height:50px}.choice-card .enlarge{display:block;margin:8px auto 0;font-size:14px;padding:6px 10px;min-height:42px}.choice-card p{font-size:15px;line-height:1.8}.choice-card.good{border-color:#2c6655}.choice-card.bad{border-color:#b8663b}.word-options{display:grid;gap:12px}.word-options button{text-align:left;font-size:21px}dialog{border:2px solid #bed0c0;border-radius:20px;max-width:95vw;width:800px}dialog::backdrop{background:#193b3690}dialog svg{min-width:0}#multiCards[hidden],#wordOptions[hidden]{display:none!important}#feedback{white-space:pre-line}@media(max-width:560px){.cards{grid-template-columns:1fr}} </style></head><body><main><header><p>しょう3 りか ／ じっけんのあとに</p><h1>💡 つく？ つかない？</h1><p>どうせんのさきが、どこにつながっているかみよう。</p></header><nav aria-label="コース"><button id="basic" onclick="start('basic')">きほん・ソケットあり</button><button id="challenge" onclick="start('challenge')">チャレンジ・ソケットなし</button><button id="multi" onclick="start('multi')">くらべてえらぶ</button><button id="words" onclick="start('words')">ことばチェック</button></nav><article><div class="meta"><span id="progress"></span><span id="course"></span></div><h2 id="question">このつなぎかたで、あかりはつく？</h2><div id="diagram"></div><div class="tools"><button id="zoom" onclick="toggleZoom()">ずをおおきくする</button></div><p class="hint" id="instruction">●はどうせんのさきです。かんでんちとまめでんきゅうは、どちらもつかえるものとします。</p><div id="multiCards" class="cards" hidden></div><div id="wordOptions" class="word-options" hidden></div><div class="answers" id="answers"><button onclick="answer(true)" id="yes">○ つく</button><button onclick="answer(false)" id="no">× つかない</button></div><div id="feedback" role="status" aria-live="polite" hidden></div><button id="next" class="primary" onclick="next()" hidden>つぎへ</button><div id="end" hidden></div></article><footer>じっけんではせんせいのはなしをききましょう。かんでんちの＋と−を、どうせんだけでつないではいけません。あつくなることがあります。</footer></main><dialog id="detail"><button onclick="document.getElementById('detail').close()">とじる</button><div id="detailDiagram"></div></dialog><script>
const questions=[
{id:'s1',kind:'basic',ends:['left','right'],on:true,why:'かんでんちの「＋のところ」から、まめでんきゅうをとおって「−のところ」まで、ひとつのわにつながっているので、つきます。'},
{id:'s2',kind:'basic',ends:['left','right'],reverse:true,on:true,why:'かんでんちのむきをはんたいにしても、まめでんきゅうをとおるひとつのわができているので、つきます。'},
{id:'s3',kind:'basic',ends:['right','left'],on:true,why:'どうせんをいれかえても、まめでんきゅうをとおるひとつのわができているので、つきます。どうせんがかさなってみえるところは、つながっていません。'},
{id:'s4',kind:'basic',ends:['left','right'],bend:true,on:true,why:'どうせんがまがっていても、つきます。まめでんきゅうをとおるひとつのわが、きれずにつながっているからです。'},
{id:'s5',kind:'basic',ends:['loose','right'],on:false,why:'ひだりのどうせんのさきが、かんでんちからはなれています。でんきのとおりみちがきれているので、つきません。'},
{id:'s6',kind:'basic',ends:['left','body'],on:false,why:'みぎのどうせんは、かんでんちのよこのおおいについています。「＋のところ」につながっていないので、つきません。'},
{id:'s7',kind:'basic',ends:['bodyLeft','right'],on:false,why:'ひだりのどうせんは、かんでんちのよこのおおいについています。「−のところ」につながっていないので、つきません。'},
{id:'s8',kind:'basic',ends:['left','looseRight'],on:false,why:'みぎのどうせんのさきが、かんでんちからはなれています。でんきのとおりみちがきれているので、つきません。'},
{id:'b1',kind:'challenge',ends:['left','right'],contacts:['tip','shell'],on:true,why:'まめでんきゅうの「いちばんしたのきんぞく」と「よこのきんぞく」が、かんでんちの＋と−につながっています。まめでんきゅうのなかをとおるひとつのわができているので、つきます。'},
{id:'b2',kind:'challenge',ends:['left','right'],contacts:['tip','shell'],reverse:true,on:true,why:'かんでんちのむきをはんたいにしても、つきます。まめでんきゅうのしたとよこのきんぞくが、＋と−につながり、ひとつのわができているからです。'},
{id:'b3',kind:'challenge',ends:['left','right'],contacts:['tip','glass'],on:false,why:'みぎのどうせんは、まめでんきゅうのガラスについています。ガラスはでんきをとおさないので、つきません。よこのきんぞくにつなぎましょう。'},
{id:'b4',kind:'challenge',ends:['left','looseRight'],contacts:['tip','shell'],on:false,why:'みぎのどうせんが、かんでんちからはなれています。まめでんきゅうにつながっていても、ひとつのわができていないので、つきません。'}
];
const $=id=>document.getElementById(id);let mode='basic',queue=[],i=0,score=0,done=false,misses=[],selected=new Set();
function shuffle(a){a=a.slice();for(let j=a.length-1;j>0;j--){let k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a}
function choose(m){const list=questions.filter(q=>q.kind===m);return m==='basic'?shuffle([...shuffle(list.filter(q=>q.on)).slice(0,Math.random()<.5?2:3),...shuffle(list.filter(q=>!q.on))]).slice(0,5):shuffle(list)}

const vocabulary=[
{q:'でんきが とおると、あかりが つくものは？',a:'まめでんきゅう',options:['まめでんきゅう','どうせん','ソケット'],why:'まめでんきゅうは、でんきが とおると あかりが つきます。'},
{q:'でんきの とおりみちが、ひとつの わに なったものを なんという？',a:'かいろ',options:['かいろ','ソケット','まめでんきゅう'],why:'でんきの とおりみちが、ひとつの わに なったものを「かいろ」と いいます。'},
{q:'かんでんちと まめでんきゅうを つなぐ せんを なんという？',a:'どうせん',options:['どうせん','まめでんきゅう','ソケット'],why:'どうせんは、でんきを とおす せんです。かんでんちや ソケットを つなぎます。'},
{q:'かんでんちの「＋」の ところの なまえは？',a:'プラスきょく',options:['プラスきょく','マイナスきょく','まめでんきゅう'],why:'「＋」の ところを「プラスきょく」と いいます。'},
{q:'かんでんちの「−」の ところの なまえは？',a:'マイナスきょく',options:['マイナスきょく','プラスきょく','ソケット'],why:'「−」の ところを「マイナスきょく」と いいます。'},
{q:'まめでんきゅうを ねじこんで とりつける どうぐの なまえは？',a:'ソケット',options:['ソケット','まめでんきゅう','かいろ'],why:'まめでんきゅうを「ソケット」に とりつけると、どうせんを つないで つかえます。'},
{q:'この じっけんで、でんきを ながすために つかうものは？',a:'かんでんち',options:['かんでんち','ソケット','まめでんきゅう'],why:'かんでんちは、かいろに でんきを ながすために つかいます。'}
];
function makeMulti(){const rounds=[],seen=new Set();while(rounds.length<5){const n=1+Math.floor(Math.random()*3);const items=shuffle([...shuffle(questions.filter(q=>q.kind==='basic'&&q.on)).slice(0,n),...shuffle(questions.filter(q=>q.kind==='basic'&&!q.on)).slice(0,4-n)]);const key=items.map(q=>q.id).sort().join(',');if(!seen.has(key)){seen.add(key);rounds.push({items})}}return rounds}

function start(m,qs){mode=m;queue=qs||(m==='multi'?makeMulti():m==='words'?shuffle(vocabulary).slice(0,5):choose(m));i=0;score=0;misses=[];for(const id of ['basic','challenge','multi','words'])$(id).className=m===id?'selected':'';show()}
function diagram(q,reveal=false){const bare=q.kind==='challenge';const pts={left:[190,338],right:[450,338],body:[390,300],bodyLeft:[250,300],loose:[140,282],looseRight:[500,282]};let tips=bare?{tip:[320,191],shell:[344,164],glass:[353,94]}:{a:[262,168],b:[378,168]};let starts=bare?q.contacts.map(t=>tips[t]):[tips.a,tips.b];let parts=[];const wire=(d,color)=>`<path d="${d}" fill="none" stroke="white" stroke-width="13"/><path d="${d}" fill="none" stroke="${color}" stroke-width="7" stroke-linecap="round"/>`;q.ends.forEach((name,n)=>{const [x,y]=starts[n],[ex,ey]=pts[name];let side=n===0?85:555;let d=`M ${x} ${y} C ${side} ${y+25},${side} ${ey-25},${ex} ${ey}`;if(q.bend&&n===0)d=`M ${x} ${y} C 30 100,35 285,105 245 S 160 285,${ex} ${ey}`;parts.push(wire(d,n?'#b75a34':'#2c7291'))});const on=reveal&&q.on;let bulb=`<circle cx="320" cy="92" r="45" fill="${on?'#ffe788':'#edf3f0'}" stroke="#536b61" stroke-width="3"/><path d="M 299 130 L 299 141 H 341 V 130" fill="#e1e6df" stroke="#536b61" stroke-width="3"/><path d="M 308 139 V 100 Q 320 72 332 100 V 139" fill="none" stroke="${on?'#d58218':'#6f7a70'}" stroke-width="3"/>`;if(bare)bulb+=`<rect x="296" y="142" width="48" height="39" rx="3" fill="#b9c5c0" stroke="#536b61" stroke-width="3"/><path d="M 298 150 L 342 144 M 298 160 L 342 154 M 298 170 L 342 164 M 298 180 L 342 174" stroke="#75877d" stroke-width="2"/><path d="M 303 182 H337 L329 190 H311 Z" fill="#263c33"/><ellipse cx="320" cy="191" rx="9" ry="4" fill="#aebcb3" stroke="#536b61"/>`;else bulb+=`<rect x="270" y="143" width="100" height="58" rx="12" fill="#e4e4d3" stroke="#536b61" stroke-width="3"/><path d="M 262 168 H278 M362 168 H378" stroke="#777e70" stroke-width="9"/><text x="320" y="228" text-anchor="middle" class="label">ソケット</text>`;const rev=!!q.reverse;let cell=`<rect x="190" y="300" width="260" height="76" rx="18" fill="#607e88" stroke="#364e48" stroke-width="3"/><path d="M320 302 H430 Q450 302 450 320 V356 Q450 374 430 374 H320 Z" fill="#bb7054"/><rect x="181" y="322" width="18" height="32" rx="3" fill="#bfc9c0" stroke="#536b61" stroke-width="2"/><rect x="441" y="322" width="18" height="32" rx="3" fill="#bfc9c0" stroke="#536b61" stroke-width="2"/><text x="222" y="347" font-size="28" fill="white">${rev?'＋':'−'}</text><text x="393" y="347" font-size="28" fill="white">${rev?'−':'＋'}</text><text x="320" y="403" text-anchor="middle" class="label">かんでんち</text>`;let markers=q.ends.map((name,n)=>{let [x,y]=pts[name];return `<circle cx="${x}" cy="${y}" r="5.5" fill="${n?'#b75a34':'#2c7291'}" stroke="white" stroke-width="1.5"/>`}).join('')+starts.map(([x,y],n)=>`<circle cx="${x}" cy="${y}" r="5.5" fill="${n?'#b75a34':'#2c7291'}" stroke="white" stroke-width="1.5"/>`).join('');let annotate=bare&&reveal?`<text x="394" y="157" class="label">よこのきんぞく</text><path d="M385 161 H350" stroke="#536b61"/><text x="380" y="205" class="label">したのきんぞく</text><path d="M373 200 L334 191" stroke="#536b61"/>`:'';return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" role="img" aria-label="かんでんち1ことまめでんきゅう1このつなぎかた。どうせんのさきのつながりかたをたしかめましょう。">${on?'<circle cx="320" cy="92" r="62" fill="#fff4b7"/>':''}${cell}${bulb}${parts.join('')}${markers}${annotate}</svg>`}

function toggleZoom(){$('diagram').classList.toggle('big');$('zoom').textContent=$('diagram').classList.contains('big')?'ずをもどす':'ずをおおきくする'}
const names=['ア','イ','ウ','エ'];
function show(){done=false;selected=new Set();const q=queue[i];$('progress').textContent=(i+1)+' / '+queue.length+'もん';$('course').textContent={basic:'きほん',challenge:'チャレンジ',multi:'くらべてえらぶ',words:'ことばチェック'}[mode];for(const id of ['diagram','zoom','instruction','answers','multiCards','wordOptions','feedback','next','end'])$(id).hidden=true;$('diagram').className='';$('zoom').textContent='ずをおおきくする';$('multiCards').replaceChildren();$('wordOptions').replaceChildren();
if(mode==='multi'){showMulti(q);return}
if(mode==='words'){showWord(q);return}
$('question').textContent='このつなぎかたで、あかりはつく？';$('diagram').innerHTML=diagram(q);for(const id of ['diagram','zoom','instruction','answers'])$(id).hidden=false;
$('instruction').textContent='●は どうせんの さきです。かんでんちと まめでんきゅうは、どちらも つかえるものと します。';
$('answers').innerHTML='<button id="yes" onclick="answer(true)">○ つく</button><button id="no" onclick="answer(false)">× つかない</button>'}
function showMulti(q){$('question').textContent='あかりが つくものを、ぜんぶ えらぼう。';$('instruction').hidden=false;$('instruction').textContent='つくと おもう ずを タップしよう。もういちど タップすると、えらびなおせます。どうせんが かさなって みえるところは、つながっていません。';$('multiCards').hidden=false;
q.items.forEach((item,j)=>{const card=document.createElement('section');card.className='choice-card';card.id='card'+j;card.innerHTML='<button class="pick" id="pick'+j+'" aria-pressed="false" onclick="pick('+j+')">'+names[j]+'　□ えらぶ</button>'+diagram(item)+'<button class="enlarge" onclick="openDiagram('+j+')">'+names[j]+'の ずを おおきくする</button><p id="reason'+j+'" hidden></p>';$('multiCards').appendChild(card)});
$('answers').hidden=false;$('answers').innerHTML='<button id="checkMulti" class="primary" onclick="answerMulti()">こたえあわせ</button>'}
function pick(j){if(done)return;selected.has(j)?selected.delete(j):selected.add(j);const on=selected.has(j);$('pick'+j).setAttribute('aria-pressed',String(on));$('pick'+j).textContent=names[j]+(on?'　☑ えらんだ':'　□ えらぶ');$('card'+j).className='choice-card'+(on?' picked':'')}
function openDiagram(j){$('detailDiagram').innerHTML=diagram(queue[i].items[j],done);$('detail').showModal()}
function answerMulti(){if(done)return;if(!selected.size){$('feedback').hidden=false;$('feedback').textContent='つくと おもうものを えらんでから、こたえあわせを おそう。';return}const q=queue[i],correct=q.items.every((item,j)=>selected.has(j)===item.on);mark(correct);const right=q.items.flatMap((item,j)=>item.on?[names[j]]:[]);$('feedback').textContent=(correct?'○ せいかい！':'たしかめよう。')+' つくのは「'+right.join('・')+'」です。';
q.items.forEach((item,j)=>{$('pick'+j).disabled=true;$('card'+j).className='choice-card '+(selected.has(j)===item.on?'good':'bad');$('reason'+j).hidden=false;$('reason'+j).textContent=names[j]+'：'+(item.on?'○ つく。':'× つかない。')+item.why;const svg=$('card'+j).querySelector('svg');svg.outerHTML=diagram(item,true)})}
function showWord(q){$('question').textContent=q.q;$('wordOptions').hidden=false;shuffle(q.options).forEach(t=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>answerWord(t,b);$('wordOptions').appendChild(b)})}
function answerWord(t,b){if(done)return;const q=queue[i];mark(t===q.a);for(const option of $('wordOptions').children){option.disabled=true;if(option.textContent===q.a)option.className='correct'}if(t!==q.a)b.className='wrong';$('feedback').textContent=(t===q.a?'○ せいかい！':'たしかめよう。')+' '+q.why}
function mark(correct){done=true;if(correct)score++;else misses.push(queue[i]);$('feedback').hidden=false;$('next').hidden=false;$('next').textContent=i===queue.length-1?'けっかをみる':'つぎへ';if(mode==='multi')$('checkMulti').disabled=true}
function answer(v){if(done)return;const q=queue[i];mark(v===q.on);$('yes').disabled=$('no').disabled=true;$(q.on?'yes':'no').className='correct';if(v!==q.on)$(v?'yes':'no').className='wrong';$('diagram').innerHTML=diagram(q,true);$('feedback').textContent=(v===q.on?'○ せいかい！':'たしかめよう。')+' このつなぎかたは「'+(q.on?'つく':'つかない')+'」。'+q.why}
function next(){if(!done)return;if(++i<queue.length)return show();for(const id of ['diagram','zoom','instruction','answers','multiCards','wordOptions','feedback','next'])$(id).hidden=true;$('progress').textContent='おつかれさま！';$('question').textContent=queue.length+'もんちゅう '+score+'もんせいかい';$('end').hidden=false;$('end').replaceChildren();const msg=document.createElement('p');msg.textContent=mode==='words'?'ことばの いみも、たしかめて おこう。':'かんでんちの ＋から、まめでんきゅうを とおって −まで、ひとつの わに なっているか たしかめよう。';$('end').appendChild(msg);if(misses.length){const b=document.createElement('button');b.textContent='まちがえた もんだいを もういちど';b.onclick=()=>start(mode,misses.slice());$('end').appendChild(b)}const b=document.createElement('button');b.textContent='もういちど チャレンジ';b.onclick=()=>start(mode);$('end').appendChild(b)}
start('basic');
</script></body></html>
